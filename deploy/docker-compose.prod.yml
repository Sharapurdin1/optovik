# Боевой запуск на VPS (/opt/optovik). Копируется туда автодеплоем.
# Секреты приложения — в /opt/optovik/.env (лежит только на сервере).
services:
  app:
    image: ghcr.io/sharapurdin1/optovik:${IMAGE_TAG:-latest}
    env_file: .env
    restart: unless-stopped
    expose:
      - "3000"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      # Домен сайта (из /opt/optovik/.env). Для него Caddy сам выпускает HTTPS.
      DOMAIN: ${DOMAIN:?в .env на сервере не задан DOMAIN}
      REDIRECT_HOSTS: ${REDIRECT_HOSTS:?в .env на сервере не задан REDIRECT_HOSTS}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

# IPv6 для контейнеров: из российских дата-центров api.telegram.org
# доступен только по IPv6 (IPv4 блокируется), а без него не уходят
# уведомления о заказах.
networks:
  default:
    enable_ipv6: true

volumes:
  caddy_data:
  caddy_config:
