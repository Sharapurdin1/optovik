# Автодеплой: push в main → собрать Docker-образ → GHCR → выкатить на VPS.
name: Deploy

on:
  push:
    branches: [main]
    # Правки только документации сайт не меняют — не пересобираем.
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/sharapurdin1/optovik

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v7

      - name: SSH-доступ к серверу
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" | tr -d '\r' > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          if ! ssh-keygen -y -f ~/.ssh/id_ed25519 > /dev/null; then
            # Диагностика без утечки: только заголовки и размер, не сам ключ.
            echo "Строк: $(wc -l < ~/.ssh/id_ed25519), символов: $(wc -c < ~/.ssh/id_ed25519)"
            echo "Первая строка: $(head -1 ~/.ssh/id_ed25519 | grep -o -- '-----[A-Z ]*-----' || echo 'не заголовок ключа')"
            echo "Последняя строка: $(tail -1 ~/.ssh/id_ed25519 | grep -o -- '-----[A-Z ]*-----' || echo 'не заголовок ключа')"
            echo "::error::Секрет SSH_PRIVATE_KEY повреждён — вставьте ключ целиком, от BEGIN до END"
            exit 1
          fi
          printf '%s\n' "${{ secrets.SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts

      # Ошибка в Caddyfile положила бы сайт — проверяем до копирования.
      - name: Проверить Caddyfile
        run: |
          docker run --rm -e DOMAIN=example.com -e REDIRECT_HOSTS=www.example.com \
            -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2-alpine caddy validate --config /etc/caddy/Caddyfile

      - name: Скопировать конфиги
        run: |
          scp deploy/docker-compose.prod.yml deploy/Caddyfile deploy/backup-db.sh \
            deploy/setup-offsite-backup.sh deploy/optovik-backup.service deploy/optovik-backup.timer \
            deploy@${{ secrets.SSH_HOST }}:/opt/optovik/

      - name: Выкатить новую версию
        run: |
          ssh deploy@${{ secrets.SSH_HOST }} bash -s <<'SCRIPT'
          set -euo pipefail
          cd /opt/optovik
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          export IMAGE_TAG="${{ github.sha }}"
          docker compose -f docker-compose.prod.yml pull app
          # Caddy обновляем при случае: Docker Hub бывает отвечает 429 (лимит
          # скачиваний) — это не повод срывать выкат, работаем на текущем образе.
          docker compose -f docker-compose.prod.yml pull caddy || echo "⚠️ Caddy не обновлён (Docker Hub), остаётся текущий"
          docker compose -f docker-compose.prod.yml up -d --remove-orphans
          docker logout ghcr.io

          # Ждём, пока приложение станет здоровым (миграции + проверка базы).
          for i in $(seq 1 30); do
            status=$(docker inspect -f '{{.State.Health.Status}}' "$(docker compose -f docker-compose.prod.yml ps -q app)")
            [ "$status" = "healthy" ] && echo "✅ Приложение здорово" && break
            sleep 5
          done
          [ "$status" = "healthy" ] || { docker compose -f docker-compose.prod.yml logs --tail 80 app; exit 1; }

          # Caddy сам не замечает новый Caddyfile — перечитываем без остановки.
          # С ошибкой в файле Caddy оставит старые настройки, а деплой упадёт.
          # Несколько попыток: только что запущенный Caddy может быть ещё не готов.
          reloaded=""
          for i in 1 2 3; do
            if docker compose -f docker-compose.prod.yml exec -T caddy caddy reload --config /etc/caddy/Caddyfile; then
              reloaded=1; break
            fi
            sleep 3
          done
          [ -n "$reloaded" ] || exit 1

          # Ежедневная копия базы (второй бэкап): скрипт и таймер — из репозитория.
          # age — шифрование копии, которая уходит на Яндекс Диск.
          command -v age > /dev/null || sudo -n env DEBIAN_FRONTEND=noninteractive apt-get install -y -qq age
          chmod 700 backup-db.sh setup-offsite-backup.sh
          sudo -n install -m 644 optovik-backup.service optovik-backup.timer /etc/systemd/system/
          sudo -n systemctl daemon-reload
          sudo -n systemctl enable --now optovik-backup.timer

          # Старые версии образа копятся — удаляем неиспользуемые старше 3 дней
          # (запущенный сейчас образ не трогается).
          docker image prune -af --filter "until=72h"
          SCRIPT
